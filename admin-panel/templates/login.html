<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>Yönetim paneli · HomeLab</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='panel.css') }}">
  </head>
  <body>
    <main class="auth-shell">
      <a class="brand" href="{{ url_for('login') }}" aria-label="HomeLab yönetim paneli">
        <span class="brand-mark" aria-hidden="true">H<span>.</span></span>
        <span>HomeLab</span>
      </a>
      <section class="auth-card" aria-labelledby="login-title">
        <p class="eyebrow"><span></span> ÖZEL ALAN</p>
        <h1 id="login-title">Yönetim paneli</h1>
        <p class="intro">Devam etmek için giriş yap.</p>
        {% if request.args.get("signed_out") == "1" %}
          <p class="notice" role="status">Oturum kapatıldı.</p>
        {% endif %}
        {% if error %}
          <p class="error" role="alert">{{ error }}</p>
        {% endif %}
        <form method="post" action="{{ url_for('login') }}" autocomplete="on">
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
          <label for="username">Kullanıcı adı</label>
          <input id="username" name="username" type="text" autocomplete="username" required autofocus maxlength="254">
          <label for="password">Şifre</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
          <button type="submit">Giriş yap <span aria-hidden="true">→</span></button>
        </form>
      </section>
      <p class="security-note">Bu alan yalnızca yetkili kullanıcılar içindir.</p>
    </main>
  </body>
</html>
